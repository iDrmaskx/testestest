<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock In — Focus Timer</title>
<meta name="theme-color" content="#14171C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#12151A;
    --surface:#1B1F27;
    --surface-2:#232833;
    --line:#2C323F;
    --text:#E9ECF1;
    --text-dim:#8C94A4;
    --mint:#5FE8CF;
    --mint-dim:#2C6E63;
    --amber:#F2B84B;
    --danger:#E8636B;
    --radius:14px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-ui);
    display:flex; flex-direction:column;
    min-height:100dvh;
    overscroll-behavior:none;
  }
  header.top{
    padding:20px 20px 8px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top h1{
    font-size:19px; font-weight:700; letter-spacing:-0.01em; margin:0;
  }
  header.top .streak{
    font-family:var(--font-num); font-size:13px; color:var(--text-dim);
  }
  main{flex:1; overflow-y:auto; padding:0 16px 100px; max-width:520px; margin:0 auto; width:100%;}
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---- Timer view ---- */
  .label-picker{
    display:flex; gap:8px; overflow-x:auto; padding:6px 2px 18px; scrollbar-width:none;
  }
  .label-picker::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 14px; border-radius:100px; font-size:13.5px;
    border:1px solid var(--line); background:var(--surface); color:var(--text-dim);
    cursor:pointer; white-space:nowrap; transition:border-color .15s, color .15s;
  }
  .chip.active{ color:var(--bg); font-weight:600; border-color:transparent; }
  .chip-add{ color:var(--mint); border-style:dashed; }

  .ring-wrap{ position:relative; display:flex; justify-content:center; margin:6px 0 22px; }
  .ring-num{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center;
  }
  .ring-num .time{ font-family:var(--font-num); font-size:52px; font-weight:600; letter-spacing:-0.02em; }
  .ring-num .phase{ font-size:12.5px; color:var(--text-dim); margin-top:2px; text-transform:none; }

  .controls{display:flex; gap:10px; justify-content:center; margin-bottom:26px;}
  button.pill{
    font-family:inherit; font-size:14.5px; font-weight:600; padding:13px 22px;
    border-radius:100px; border:none; cursor:pointer;
  }
  .pill.primary{ background:var(--mint); color:#0B1210; }
  .pill.ghost{ background:var(--surface-2); color:var(--text); }
  .pill.danger{ background:transparent; color:var(--danger); border:1px solid #4A2A2C; }
  .pill:disabled{ opacity:.4; }

  .presets{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;
  }
  .preset-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; cursor:pointer; text-align:left;
  }
  .preset-card.active{ border-color:var(--mint); background:#17231F; }
  .preset-card .pname{ font-size:14px; font-weight:600; }
  .preset-card .psub{ font-size:12px; color:var(--text-dim); margin-top:3px; font-family:var(--font-num); }

  .custom-row{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
  }
  .custom-row label{ font-size:14px; flex:1; }
  .custom-row input{
    width:64px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:var(--font-num); font-size:15px; padding:7px 8px; text-align:center;
  }

  /* ---- Stats view ---- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:16px 0 22px; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 10px; text-align:center; }
  .stat-card .val{ font-family:var(--font-num); font-size:20px; font-weight:600; }
  .stat-card .lbl{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }

  h2.section-title{ font-size:14px; color:var(--text-dim); font-weight:600; margin:22px 0 10px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .bar-row .bname{ width:84px; font-size:12.5px; color:var(--text-dim); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:9px; background:var(--surface-2); border-radius:100px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; }
  .bar-val{ width:44px; text-align:right; font-family:var(--font-num); font-size:12px; color:var(--text-dim); flex-shrink:0; }

  .session-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .session-row .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .session-row .sinfo{ flex:1; }
  .session-row .sname{ font-size:13.5px; }
  .session-row .sdate{ font-size:11.5px; color:var(--text-dim); margin-top:1px; }
  .session-row .sdur{ font-family:var(--font-num); font-size:13px; color:var(--text-dim); }
  .empty-note{ color:var(--text-dim); font-size:13.5px; padding:14px 0; }

  /* ---- Labels view ---- */
  .label-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px 14px; margin-bottom:9px;
  }
  .label-row .dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .label-row .lname{ flex:1; font-size:14.5px; }
  .label-row button{
    background:none; border:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; padding:4px 6px;
  }
  .add-label{
    display:flex; gap:8px; margin-top:14px;
  }
  .add-label input[type=text]{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:14px; font-family:inherit;
  }
  .swatch-pick{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .swatch{ width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.sel{ border-color:var(--text); }

  /* ---- Nav ---- */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--line); display:flex; padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  nav.tabbar .tab{
    flex:1; text-align:center; background:none; border:none; color:var(--text-dim);
    font-family:inherit; font-size:11.5px; padding:6px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.tabbar .tab.active{ color:var(--mint); }
  nav.tabbar .tab svg{ width:20px; height:20px; }

  @media(max-width:380px){ .ring-num .time{ font-size:44px; } }
</style>
</head>
<body>

<header class="top">
  <h1>Lock In</h1>
  <span class="streak" id="weekStreak"></span>
</header>

<main>

  <!-- TIMER VIEW -->
  <section class="view active" id="view-timer">
    <div class="label-picker" id="labelPicker"></div>

    <div class="ring-wrap">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="106" fill="none" stroke="#232833" stroke-width="12"/>
        <circle id="ringProgress" cx="120" cy="120" r="106" fill="none" stroke="#5FE8CF"
          stroke-width="12" stroke-linecap="round" stroke-dasharray="666" stroke-dashoffset="666"
          transform="rotate(-90 120 120)"/>
      </svg>
      <div class="ring-num">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="phase" id="phaseLabel">Focus session</div>
      </div>
    </div>

    <div class="controls">
      <button class="pill ghost" id="resetBtn">Reset</button>
      <button class="pill primary" id="startBtn">Start</button>
    </div>

    <div class="presets" id="presetGrid"></div>

    <div class="custom-row">
      <label for="customMin">Custom length (minutes)</label>
      <input type="number" id="customMin" min="1" max="480" value="45">
    </div>
  </section>

  <!-- STATS VIEW -->
  <section class="view" id="view-stats">
    <div class="stat-grid">
      <div class="stat-card"><div class="val" id="statWeek">0h 0m</div><div class="lbl">This week</div></div>
      <div class="stat-card"><div class="val" id="statMonth">0h 0m</div><div class="lbl">This month</div></div>
      <div class="stat-card"><div class="val" id="statTotal">0h 0m</div><div class="lbl">All time</div></div>
    </div>

    <h2 class="section-title">This week by label</h2>
    <div id="weekBreakdown"></div>

    <h2 class="section-title">This month by label</h2>
    <div id="monthBreakdown"></div>

    <h2 class="section-title">Recent sessions</h2>
    <div id="recentSessions"></div>
  </section>

  <!-- LABELS VIEW -->
  <section class="view" id="view-labels">
    <h2 class="section-title">Your labels</h2>
    <div id="labelList"></div>

    <h2 class="section-title">Add a label</h2>
    <div class="add-label">
      <input type="text" id="newLabelName" placeholder="e.g. Deep work, Writing, Client calls" maxlength="24">
      <button class="pill primary" id="addLabelBtn">Add</button>
    </div>
    <div class="swatch-pick" id="swatchPick"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-view="timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Timer
  </button>
  <button class="tab" data-view="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    Stats
  </button>
  <button class="tab" data-view="labels">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12l-8 8-8-8V4h8z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>
    Labels
  </button>
</nav>

<audio id="chime" preload="auto"></audio>

<script>
/* ---------------- storage ---------------- */
const DB_KEY = "lockin_data_v1";
const PALETTE = ["#5FE8CF","#F2B84B","#E8636B","#8C7CF0","#5CA8F2","#F08FC0","#8FD16A","#F09A5C"];

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    labels:[
      {id:"l1", name:"Deep work", color:PALETTE[0]},
      {id:"l2", name:"Admin", color:PALETTE[1]}
    ],
    sessions:[],
    activeLabel:"l1"
  };
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

/* ---------------- presets ---------------- */
const PRESETS = [
  {id:"p25", name:"Pomodoro", work:25, brk:5},
  {id:"p50", name:"Deep Work", work:50, brk:10},
  {id:"p15", name:"Short Burst", work:15, brk:5},
  {id:"p90", name:"Extended", work:90, brk:20}
];
let selectedPreset = "p25";
let usingCustom = false;

/* ---------------- timer state ---------------- */
let phase = "focus"; // focus | break
let totalSeconds = PRESETS[0].work*60;
let remaining = totalSeconds;
let ticking = false;
let intervalId = null;
let sessionStart = null; // ms timestamp when current focus phase began (for logging)

const $ = (sel)=>document.querySelector(sel);
const timeDisplay = $("#timeDisplay");
const phaseLabel = $("#phaseLabel");
const ringProgress = $("#ringProgress");
const startBtn = $("#startBtn");
const resetBtn = $("#resetBtn");
const RING_CIRC = 2*Math.PI*106;
ringProgress.setAttribute("stroke-dasharray", RING_CIRC);

function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function currentPresetMinutes(kind){
  if(usingCustom) return kind==="work" ? Number($("#customMin").value)||1 : 5;
  const p = PRESETS.find(p=>p.id===selectedPreset);
  return kind==="work" ? p.work : p.brk;
}
function renderTimer(){
  timeDisplay.textContent = fmt(remaining);
  phaseLabel.textContent = phase==="focus" ? "Focus session" : "Break";
  const frac = 1 - (remaining/totalSeconds);
  ringProgress.style.stroke = phase==="focus" ? "#5FE8CF" : "#F2B84B";
  ringProgress.setAttribute("stroke-dashoffset", RING_CIRC*(1-frac));
  startBtn.textContent = ticking ? "Pause" : (remaining<totalSeconds ? "Resume" : "Start");
}
function setPhase(newPhase){
  phase = newPhase;
  const mins = currentPresetMinutes(phase==="focus"?"work":"break");
  totalSeconds = mins*60;
  remaining = totalSeconds;
  renderTimer();
}
function tick(){
  remaining--;
  if(remaining<=0){
    if(phase==="focus"){ logSession(); }
    const next = phase==="focus" ? "break" : "focus";
    playChime();
    setPhase(next);
    if(next==="break"){ /* auto-continue into break */ }
    else { pauseTimer(); } // stop after a break completes; user starts next focus manually
  }
  renderTimer();
}
function startTimer(){
  if(phase==="focus" && !sessionStart) sessionStart = Date.now();
  ticking = true;
  intervalId = setInterval(tick, 1000);
  renderTimer();
}
function pauseTimer(){
  ticking = false;
  clearInterval(intervalId);
  renderTimer();
}
function resetTimer(){
  pauseTimer();
  sessionStart = null;
  setPhase("focus");
}
startBtn.addEventListener("click", ()=> ticking ? pauseTimer() : startTimer());
resetBtn.addEventListener("click", resetTimer);

function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 720; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
    o.start(); o.stop(ctx.currentTime+0.6);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}

function logSession(){
  const durationMin = currentPresetMinutes("work");
  db.sessions.push({
    id:"s"+Date.now(),
    labelId: db.activeLabel,
    minutes: durationMin,
    ts: sessionStart || Date.now()
  });
  sessionStart = null;
  saveDB();
  renderStats();
}

/* ---------------- presets UI ---------------- */
function renderPresets(){
  const grid = $("#presetGrid");
  grid.innerHTML = "";
  PRESETS.forEach(p=>{
    const card = document.createElement("button");
    card.className = "preset-card" + (!usingCustom && selectedPreset===p.id ? " active":"");
    card.innerHTML = `<div class="pname">${p.name}</div><div class="psub">${p.work} focus / ${p.brk} break</div>`;
    card.addEventListener("click", ()=>{
      if(ticking) return;
      usingCustom = false; selectedPreset = p.id;
      resetTimer(); renderPresets();
    });
    grid.appendChild(card);
  });
  const customCard = document.createElement("button");
  customCard.className = "preset-card" + (usingCustom ? " active":"");
  customCard.innerHTML = `<div class="pname">Custom</div><div class="psub">Use minutes below</div>`;
  customCard.addEventListener("click", ()=>{
    if(ticking) return;
    usingCustom = true;
    resetTimer(); renderPresets();
  });
  grid.appendChild(customCard);
}
$("#customMin").addEventListener("change", ()=>{
  if(usingCustom && !ticking) resetTimer();
});

/* ---------------- labels ---------------- */
function renderLabelPicker(){
  const wrap = $("#labelPicker");
  wrap.innerHTML = "";
  db.labels.forEach(l=>{
    const chip = document.createElement("button");
    chip.className = "chip" + (db.activeLabel===l.id ? " active":"");
    chip.textContent = l.name;
    if(db.activeLabel===l.id) chip.style.background = l.color;
    chip.addEventListener("click", ()=>{
      db.activeLabel = l.id; saveDB(); renderLabelPicker();
    });
    wrap.appendChild(chip);
  });
}
function renderLabelsView(){
  const list = $("#labelList");
  list.innerHTML = "";
  if(db.labels.length===0){ list.innerHTML = '<div class="empty-note">No labels yet — add one below.</div>'; }
  db.labels.forEach(l=>{
    const row = document.createElement("div");
    row.className = "label-row";
    row.innerHTML = `<span class="dot" style="background:${l.color}"></span><span class="lname">${l.name}</span>`;
    const del = document.createElement("button");
    del.textContent = "Remove";
    del.addEventListener("click", ()=>{
      if(db.sessions.some(s=>s.labelId===l.id)){
        if(!confirm(`"${l.name}" has logged sessions. Remove it anyway? Past sessions stay in your stats as "Unlabeled".`)) return;
      }
      db.labels = db.labels.filter(x=>x.id!==l.id);
      if(db.activeLabel===l.id) db.activeLabel = db.labels[0]?.id || null;
      saveDB(); renderLabelsView(); renderLabelPicker(); renderStats();
    });
    row.appendChild(del);
    list.appendChild(row);
  });
}
let pickedColor = PALETTE[0];
function renderSwatches(){
  const wrap = $("#swatchPick");
  wrap.innerHTML = "";
  PALETTE.forEach(c=>{
    const s = document.createElement("div");
    s.className = "swatch" + (c===pickedColor ? " sel":"");
    s.style.background = c;
    s.addEventListener("click", ()=>{ pickedColor = c; renderSwatches(); });
    wrap.appendChild(s);
  });
}
$("#addLabelBtn").addEventListener("click", ()=>{
  const input = $("#newLabelName");
  const name = input.value.trim();
  if(!name) return;
  const id = "l"+Date.now();
  db.labels.push({id, name, color:pickedColor});
  db.activeLabel = id;
  input.value = "";
  saveDB();
  renderLabelsView(); renderLabelPicker();
});

/* ---------------- stats ---------------- */
function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // Monday=0
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-day);
  return dt.getTime();
}
function startOfMonth(d){
  const dt = new Date(d);
  return new Date(dt.getFullYear(), dt.getMonth(), 1).getTime();
}
function fmtHM(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return `${h}h ${m}m`;
}
function labelById(id){ return db.labels.find(l=>l.id===id); }

function renderStats(){
  const now = Date.now();
  const wStart = startOfWeek(now), mStart = startOfMonth(now);
  let weekMin=0, monthMin=0, totalMin=0;
  const weekByLabel = {}, monthByLabel = {};
  db.sessions.forEach(s=>{
    totalMin += s.minutes;
    if(s.ts>=wStart){ weekMin += s.minutes; weekByLabel[s.labelId]=(weekByLabel[s.labelId]||0)+s.minutes; }
    if(s.ts>=mStart){ monthMin += s.minutes; monthByLabel[s.labelId]=(monthByLabel[s.labelId]||0)+s.minutes; }
  });
  $("#statWeek").textContent = fmtHM(weekMin);
  $("#statMonth").textContent = fmtHM(monthMin);
  $("#statTotal").textContent = fmtHM(totalMin);
  $("#weekStreak").textContent = weekMin>0 ? fmtHM(weekMin)+" locked in" : "";

  renderBreakdown("#weekBreakdown", weekByLabel, weekMin);
  renderBreakdown("#monthBreakdown", monthByLabel, monthMin);

  const recent = [...db.sessions].sort((a,b)=>b.ts-a.ts).slice(0,12);
  const rWrap = $("#recentSessions");
  rWrap.innerHTML = "";
  if(recent.length===0){ rWrap.innerHTML = '<div class="empty-note">No sessions logged yet. Finish a focus session to see it here.</div>'; return; }
  recent.forEach(s=>{
    const l = labelById(s.labelId);
    const row = document.createElement("div");
    row.className = "session-row";
    const dt = new Date(s.ts);
    row.innerHTML = `
      <span class="dot" style="background:${l?l.color:'#555'}"></span>
      <div class="sinfo">
        <div class="sname">${l?l.name:"Unlabeled"}</div>
        <div class="sdate">${dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})}, ${dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</div>
      </div>
      <div class="sdur">${s.minutes}m</div>`;
    rWrap.appendChild(row);
  });
}
function renderBreakdown(sel, byLabel, totalMin){
  const wrap = $(sel);
  wrap.innerHTML = "";
  const entries = Object.entries(byLabel).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0){ wrap.innerHTML = '<div class="empty-note">Nothing logged in this period yet.</div>'; return; }
  entries.forEach(([labelId, mins])=>{
    const l = labelById(labelId);
    const pct = totalMin>0 ? Math.round((mins/totalMin)*100) : 0;
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bname">${l?l.name:"Unlabeled"}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${l?l.color:'#555'}"></div></div>
      <div class="bar-val">${fmtHM(mins)}</div>`;
    wrap.appendChild(row);
  });
}

/* ---------------- nav ---------------- */
document.querySelectorAll("nav .tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll("nav .tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll("section.view").forEach(v=>v.classList.remove("active"));
    tab.classList.add("active");
    $("#view-"+tab.dataset.view).classList.add("active");
    if(tab.dataset.view==="stats") renderStats();
    if(tab.dataset.view==="labels") renderLabelsView();
  });
});

/* ---------------- init ---------------- */
renderPresets();
renderLabelPicker();
renderSwatches();
setPhase("focus");
renderStats();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
